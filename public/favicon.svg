<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favBg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3d6b4f"/>
      <stop offset="100%" stop-color="#1f3d2b"/>
    </linearGradient>
    <linearGradient id="favLeaf" x1="13" y1="5" x2="22" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9dd56c"/>
      <stop offset="100%" stop-color="#558a36"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base for High Contrast against Browser Chrome -->
  <rect width="32" height="32" rx="9" fill="url(#favBg)"/>

  <!-- Basket Handle -->
  <path d="M11.5 14C11.5 10.2 13.5 7.8 16 7.8C18.5 7.8 20.5 10.2 20.5 14" 
        stroke="#f7f3ed" 
        stroke-width="2" 
        stroke-linecap="round"/>

  <!-- Sprouting Organic Leaf -->
  <path d="M16 6C16 6 21.5 7 22.5 11.5C23 14.5 19.5 16 16 16C13.5 14.5 13 10.5 16 6Z" 
        fill="url(#favLeaf)"/>

  <!-- Basket Body -->
  <path d="M7 14.5H25L23.2 24.2C22.9 25.5 21.8 26.5 20.5 26.5H11.5C10.2 26.5 9.1 25.5 8.8 24.2L7 14.5Z" 
        fill="#f7f3ed"/>

  <!-- Basket Rim Line -->
  <path d="M8 17.5H24" stroke="#3d6b4f" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Vertical Weave Accent -->
  <path d="M13 18V24" stroke="#3d6b4f" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M19 18V24" stroke="#3d6b4f" stroke-width="1.3" stroke-linecap="round"/>
</svg>
